# Sinds de domeinswitch (september 2026) staat de site op www.bclandegem.be en
# publiceert deploy-ftp.yml haar. Op https://bc-landegem.github.io/Website/ staat
# alleen nog de doorverwijzing uit pages-redirect/: elk pad gaat naar hetzelfde
# pad op www, en sw.js ruimt de service worker op bij wie de site hier ooit
# bezocht of installeerde. Zo loopt geen bladwijzer of geïnstalleerde app dood.
#
# Alleen met de hand (Actions → Deploy to GitHub Pages → Run workflow), en pas
# als www.bclandegem.be de nieuwe site toont: anders stuurt github.io bezoekers
# naar een lege of halve server. Eén keer is genoeg; de inhoud volgt de site
# niet, dus hoeft deze workflow niet mee te draaien bij een push of 's nachts.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ook /Website/ zelf doorverwijzen
        # Pages serveert 404.html voor elk onbekend pad, maar de startpagina
        # heeft een index.html nodig.
        run: cp pages-redirect/404.html pages-redirect/index.html

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-redirect/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
