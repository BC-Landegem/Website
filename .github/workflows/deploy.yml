name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build with Astro
        uses: withastro/action@v6
        env:
          # De erelijst, de zeventien seizoenspagina's, de speeldagen en de
          # spelerspagina's uit het archief worden hier gebouwd: de build praat
          # dus met de intraclub-API. Valt die weg, dan faalt de deploy — en dat
          # is de bedoeling, want een halve historiek is erger dan geen deploy.
          PUBLIC_INTRA_API: https://intra.bclandegem.be/api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
