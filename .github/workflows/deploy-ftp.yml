# Deploy van www.bclandegem.be naar de shared hosting (DirectAdmin) via FTP(S).
# Bouwt voor de root van het eigen domein (SITE_URL en BASE_PATH, zie
# astro.config.mjs) en zet dist/ met een incrementele sync op de server: alleen
# gewijzigde bestanden gaan over, verwijderde worden opgeruimd. Daarvoor bewaart
# de action .ftp-deploy-sync-state.json in de doelmap — laat dat staan.
#
# Tot september 2026 wees dit naar een testsubdomein (eigen FTP-account, eigen
# DirectAdmin-paneel) en draaide GitHub Pages ernaast. Sinds de domeinswitch is
# dit de enige deploy; deploy.yml zet op github.io alleen nog een doorverwijzing.
# Een nieuwe testomgeving is dezelfde workflow met andere waarden hieronder.
#
# Instellingen (Settings → Environments → shared-hosting):
#   secrets   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   variables SITE_URL        verplicht: https://www.bclandegem.be
#             FTP_SERVER_DIR  standaard public_html/ (DirectAdmin-webroot)
#             FTP_PROTOCOL    standaard ftps
#             NOINDEX         alleen 'true' op een testomgeving
#             VAPID_PUBLIC_KEY  publieke pushsleutel; leeg = push uit
# De repository variable TURNSTILE_SITE_KEY staat los van de environment.
name: Deploy via FTP

on:
  push:
    branches: [master]
  # Een deel van de build hangt aan de klok, niet aan een commit: seasonState()
  # verklaart een seizoen afgelopen na acht weken zonder berekende speeldag, en
  # pas dán krijgt het een eindstandpagina. Zonder deze cron gebeurt dat niet —
  # een statische site heeft geen klok, alleen builds.
  #
  # Om 04:00, een uur na media-sync: die start bij nieuwe foto's zelf deze
  # workflow, en dan hoeft die run niet op deze te wachten.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Niet afbreken: een halve FTP-sync laat de server in een tussenstand achter.
# Een tweede run wacht gewoon.
concurrency:
  group: ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # FTP-gegevens en SITE_URL staan op deze environment, niet op de repo: zo
    # kan er later een goedkeuring of branchbeperking op, en verschillen test en
    # productie alleen in wat hier ingevuld staat.
    environment:
      name: shared-hosting
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Controleer instellingen
        # Zonder SITE_URL zou de build voor github.io bouwen en dan op het
        # subdomein staan met verkeerde canonical-, manifest- en formulier-URL's.
        # Liever hard falen dan een verkeerde site online.
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "::error::Variable SITE_URL ontbreekt op environment shared-hosting."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # De root van het eigen domein in plaats van /Website op github.io.
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: /
          # De erelijst, de zeventien eindstanden en de records worden hier
          # gebouwd: de build praat dus met de intraclub-API. Valt die weg, dan
          # faalt de deploy — en dat is de bedoeling, want een halve historiek
          # is erger dan geen deploy. Met de nachtelijke cron hierboven betekent
          # dat wel dat een hapering om 04:00 een rode workflow oplevert.
          PUBLIC_INTRA_API: https://intra.bclandegem.be/api
          # Sitesleutel van Cloudflare Turnstile voor het contact- en het
          # meldformulier. Geen secret — hij staat sowieso in de HTML — dus een
          # repository variable. Is hij niet gezet, dan bouwen de formulieren
          # zonder widget en leunt de verdediging op honeypot, tijdslot en de
          # rate limit van de server.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          # Publieke VAPID-sleutel voor pushberichten, als variable op de
          # environment: zo krijgt een testomgeving een ander sleutelpaar dan
          # productie. Leeg = push uit.
          PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}

      - name: Testomgeving afschermen voor zoekmachines
        # Een geïndexeerde kopie concurreert met www.bclandegem.be en blijft na
        # de switch in de zoekresultaten hangen. De header dekt ook wat robots.txt
        # niet dekt (pagina's die via een externe link gevonden worden).
        if: ${{ vars.NOINDEX == 'true' }}
        run: |
          printf '\n# Testomgeving (variable NOINDEX)\n<IfModule mod_headers.c>\n  Header set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> dist/.htaccess
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Upload naar de hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS (expliciete TLS). Een zelfondertekend servercertificaat is
          # geen probleem: de action controleert de keten standaard niet
          # (security: loose). Kan de host geen TLS, zet dan FTP_PROTOCOL op
          # 'ftp' — het wachtwoord gaat dan in klare tekst over het net.
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          # Webroot van een DirectAdmin-account, met slash op het einde.
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          # De action sluit zelf .git* en node_modules uit; in dist/ staat daar
          # niets van. .htaccess moet wél mee, dus geen eigen exclude-lijst.
